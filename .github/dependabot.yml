version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    hexo:
      patterns:
        - "hexo*"
    markdown-it:
      patterns:
        - "markdown-it*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  groups:
    actions:
      patterns:
        - "*"

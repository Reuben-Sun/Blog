name: Sync

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Git Message'
        required: false
        default: 'Self Commit'

# 连续触发时依次执行，后一次会拿到前一次推送后的 main
concurrency:
  group: submodule-sync
  cancel-in-progress: false

jobs:
  sync:
    name: 'Submodules Sync'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 用 PAT 检出并推送：GITHUB_TOKEN 推送的提交不会触发 Pages workflow
          token: ${{ secrets.PERSONAL_TOKEN }}
          submodules: true

      - name: Pull & update submodules recursively
        run: git submodule update --init --recursive --remote

      - name: Commit update
        env:
          # 提交信息经环境变量传入，避免其中的引号、反引号被 shell 解释
          MESSAGE: ${{ github.event.inputs.name }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name 'Git bot'
          git config user.email 'bot@noreply.github.com'
          git commit -am "Submodule: ${MESSAGE:-Self Commit}"
          git push
